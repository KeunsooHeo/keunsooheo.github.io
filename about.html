<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <meta http-equiv="refresh" content="0; url=https://keunsooheo.github.io/">
    <link rel="canonical" href="https://keunsooheo.github.io/">
    <script type="text/javascript">
      // Meta 태그가 작동하지 않을 경우를 대비한 자바스크립트 리다이렉트
      window.location.href = "https://keunsooheo.github.io/"
    </script>
  </head>
  <body>
    <p>페이지가 이동되었습니다. 자동으로 이동하지 않으면 <a href="https://keunsooheo.github.io/">여기</a>를 클릭하세요.</p>
  </body>
</html>
